version: 2
# Each ecosystem declares two groups:
#   - *-version-updates   (applies-to: version-updates)  — the
#     weekly scheduled refresh; bundled so we don't get one PR per
#     dependency.
#   - *-security-updates  (applies-to: security-updates) — GHAS-
#     driven vuln fixes; bundled so fixing three CVEs in the same
#     scan produces one PR, not three.
#
# Without the explicit security-updates group, Dependabot opens one
# PR per advisory even when the `groups` block is set for version
# updates.
updates:
  # Python backend. Dependabot reads pyproject.toml but does NOT
  # understand uv.lock — the uv-lock-refresh workflow intercepts
  # its PRs and regenerates the lockfile.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      pip-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      pip-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  # Frontend (pnpm). Dependabot reads pnpm-lock.yaml directly.
  # `directories` (plural) folds the example app under the same
  # group, so a weekly refresh produces one PR across both paths
  # instead of one per directory. Without this, a vite bump in
  # /examples/hello-world/frontend opens its own PR even though
  # the same package lives in /frontend.
  #
  # "/" is the workspace overlay lock (packages/* + the hello-world
  # example). It has to be listed explicitly: the dependency graph
  # raises alerts for any lockfile it finds, but Dependabot only
  # opens security-update PRs for directories declared here, so an
  # advisory against the root lock would otherwise sit open forever
  # with nothing to fix it.
  #
  # Caveat this triggers: on a GROUPED multi-directory update
  # Dependabot bumps the package.json files but leaves both pnpm
  # lockfiles stale, failing `pnpm install --frozen-lockfile`. The
  # pnpm-lock-refresh / pnpm-lock-commit workflow pair intercepts
  # these PRs and regenerates the lockfiles; dependabot-auto-merge
  # then merges patch/minor groups once CI is green. See
  # docs/dependabot-automation.md.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/frontend"
      - "/examples/hello-world/frontend"
    schedule:
      interval: "weekly"
    # TypeScript 7 (the native compiler) ships no JS API, and
    # typescript-eslint peers on `typescript <6.1.0` and refuses to load
    # under 7.x. /frontend therefore runs the side-by-side setup from the
    # TS 7 release notes: `@typescript/native` (npm:typescript@^7) is
    # what `tsc` runs, while `typescript` is aliased to the
    # `@typescript/typescript6` API shim so typescript-eslint can import
    # it. Bumping that alias to 7 is the bump that turned the weekly
    # group red at `pnpm lint` and held up a vitest security fix (#278),
    # so TypeScript majors are ignored. Minors on 7.x (the packages, the
    # hello-world example, `@typescript/native`) still come through.
    # Drop this and the alias once typescript-eslint supports 7
    # (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      npm-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions — pinned SHAs in .github/workflows/ get bumped
  # when their release tags move.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      actions-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  # Docker base images. Separate entries per Dockerfile because
  # Dependabot keys on directory. The nginx proxy pulls nginx:alpine
  # straight from docker-compose.yml — not a tracked ecosystem.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      docker-backend-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      docker-backend-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      docker-frontend-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      docker-frontend-security-updates:
        applies-to: security-updates
        patterns: ["*"]
