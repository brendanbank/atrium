name: Publish image

# Strictly tag-driven publishing to GHCR. No `master` push trigger; no
# `edge` or per-commit images. Tag from a green master — `ci.yml`
# already covers PR validation, and gating publish on `needs:` would
# mean re-running every PR check on the tagged commit (wasted work
# when it already passed).
#
# `workflow_dispatch` lets a maintainer re-run an existing tag (eg.
# registry outage recovery) without retagging.
#
# The weekly `schedule` re-publishes the *current* release tag so a
# released image never drifts more than seven days behind Debian
# security. CI validates the recipe on every PR but nothing used to
# re-validate the artifact, so `v0.28.0` sat on openssl 3.5.6 for two
# weeks and only downstream consumers ever saw it (issue #239). The
# rebuild is only meaningful because the runtime `apt-get upgrade`
# layer is cache-busted by `APT_REFRESH` — without that the warm
# `type=gha` cache would make the scheduled run a silent no-op.
#
# Per-arch parallel builds: amd64 on ubuntu-24.04, arm64 on
# ubuntu-24.04-arm. Each matrix job pushes its image by digest only
# (no tags); the merge job assembles the multi-arch manifest list
# under the canonical semver tags. This replaces the previous
# unified single-runner build that emulated arm64 via qemu — the
# emulation was the dominant cost (8 min for a typical release).
# Native arm64 runners are free for private repos on the Team plan;
# if the runner ever becomes unavailable, swap matrix.runner.arm64
# back to ubuntu-24.04 and re-add docker/setup-qemu-action to fall
# back to emulation.
on:
  push:
    tags:
      - "v*"
  # Monday 05:00 UTC — an hour ahead of the weekly Security scan so
  # the published-image job in `security.yml` scans the image this
  # run just refreshed. That ordering is deliberate: if the rebuild
  # ever no-ops, the scan is what makes it visible.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to (re-)publish (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# IMAGE_NAME is computed per-job from ``github.repository_owner``
# lowercased. The owner login can contain uppercase characters
# (e.g. ``brendanbank``) but GHCR refs are case-sensitive and reject
# anything that isn't all-lowercase. ``docker/metadata-action`` is
# tolerant — it normalises internally — but the per-arch refactor
# also feeds the name straight into ``build-push-action``'s
# ``outputs:`` ref and the merge step's ``printf``, neither of which
# normalise. Computing once into ``$GITHUB_ENV`` keeps every later
# reference consistent and avoids stamping a mixed-case ref into the
# push.

jobs:
  # Every trigger carries the target tag somewhere different:
  #   push               -> github.ref_name       (refs/tags/v1.2.3)
  #   workflow_dispatch  -> inputs.ref            (github.ref is master)
  #   schedule           -> nowhere; ask the API for the current release
  # Resolving once here keeps checkout, the metadata-action semver
  # values and the manifest tags reading the same string, instead of
  # repeating a `||` chain at every use site (which had no schedule
  # branch at all and would have published `latest` only).
  resolve:
    name: Resolve target tag
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      apt_refresh: ${{ steps.pick.outputs.apt_refresh }}
    steps:
      - name: Pick tag + apt cache-buster
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)              ref="$PUSH_REF" ;;
            workflow_dispatch) ref="$INPUT_REF" ;;
            # `releases/latest` excludes drafts and pre-releases, so
            # this is exactly the tag a consumer following `latest`
            # is running.
            schedule)          ref=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name) ;;
            *)                 ref="" ;;
          esac
          if [ -z "$ref" ]; then
            echo "::error::could not resolve a tag to publish for event '$EVENT_NAME'" >&2
            exit 1
          fi
          echo "Publishing $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # Stamped once, here, so both arch builds share a value even
          # if one of them straddles midnight UTC.
          echo "apt_refresh=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Resolve image name + platform pair
        # buildx artifact names can't contain slashes; turn linux/amd64
        # into linux-amd64 for the digest artifact name + cache scope.
        # ``${var,,}`` is bash's lowercase parameter expansion.
        run: |
          owner="${{ github.repository_owner }}"
          echo "IMAGE_NAME=ghcr.io/${owner,,}/atrium" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      # Read the sha off the checkout, not ``github.sha``: on
      # ``workflow_dispatch`` and ``schedule`` the latter is the
      # workflow file's branch (master), while the checkout above is
      # at the resolved tag — a re-publish would otherwise stamp the
      # image with a commit it wasn't built from.
      - name: Resolve build commit
        run: echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Regression guard for issue #91: v0.19.0 shipped with the SPA
      # bundle built from VITE_API_BASE_URL="" because the build-args
      # block above silently overrode the Dockerfile default. The
      # backend moved to /api/* in v0.19.0 but the published bundle
      # still called un-prefixed paths, so every API call fell
      # through to the SPA fallback and returned index.html.
      #
      # Build the frontend stage to a local dir and grep — fails
      # the publish job before the digest push if the prefix is
      # missing. Runs on amd64 only because the SPA bundle is
      # platform-agnostic JavaScript; doing it twice would just
      # double the cost.
      - name: Verify SPA bundle bakes /api prefix
        if: matrix.platform == 'linux/amd64'
        run: |
          # ``--output type=local`` exports the full filesystem of the
          # target stage, so the bundle lands at ``app/dist/assets/...``
          # (mirroring the Dockerfile's ``WORKDIR /app``), not
          # ``dist/assets/...``. ``find`` keeps the check robust to
          # future workdir changes.
          docker buildx build \
            --target frontend-builder \
            --build-arg VITE_API_BASE_URL=/api \
            --output type=local,dest=/tmp/spa-check \
            --cache-from type=gha,scope=runtime-${{ env.PLATFORM_PAIR }} \
            .
          bundle=$(find /tmp/spa-check -path '*/dist/assets/index-*.js' -type f | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::SPA bundle file not found in /tmp/spa-check — exporter layout changed?" >&2
            find /tmp/spa-check -maxdepth 4 -type d | head -20 >&2
            exit 1
          fi
          if ! grep -q '/api' "$bundle"; then
            echo "::error::SPA bundle does not contain /api — VITE_API_BASE_URL build arg lost (issue #91)" >&2
            exit 1
          fi
          echo "SPA bundle contains /api prefix ($bundle)"

      # OCI labels for the image config. Without these the published
      # image carries no version marker at all: there is no
      # /app/VERSION, `uv sync` does not install atrium-backend as a
      # distribution so importlib.metadata raises PackageNotFoundError
      # inside the container, and `docker inspect` reported
      # Config.Labels as null. A host verifying a deploy therefore had
      # to exec into a running container and read /app/pyproject.toml.
      # With these, `docker buildx imagetools inspect` answers it from
      # the registry.
      #
      # Same `value=` override as the merge job: type=semver defaults to
      # reading github.ref, which is the branch on workflow_dispatch and
      # schedule, so the resolved tag has to be fed in explicitly or the
      # version label silently goes missing.
      - name: Compute image labels
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.ref }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          # Baked into the image config, so they survive the merge job
          # assembling the manifest list from per-arch digests.
          labels: ${{ steps.labels.outputs.labels }}
          # `pull: true` re-resolves `python:3.13-slim` instead of
          # reusing whatever digest the runner had; `APT_REFRESH`
          # busts the runtime `apt-get upgrade` layer. Both are needed
          # for a rebuild of an unchanged tag to actually pick up
          # Debian point releases (issue #239).
          pull: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_DEFAULT_LANGUAGE=en
            APT_REFRESH=${{ needs.resolve.outputs.apt_refresh }}
            ATRIUM_VERSION=${{ needs.resolve.outputs.ref }}
            ATRIUM_COMMIT=${{ env.BUILD_COMMIT }}
          # No tags here — push-by-digest is what lets the merge job
          # below assemble the multi-arch manifest list under the
          # real semver tags.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runtime-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=runtime-${{ env.PLATFORM_PAIR }},mode=max

      # Regression guard for issue #239. The image we just pushed is
      # supposed to have run `apt-get -y upgrade`; if the build cache
      # served a stale layer instead, the guard below sees packages
      # still pending and fails the job before the merge step moves
      # any tag onto the digest. Simulating the upgrade (`-s`) rather
      # than diffing versions keeps this independent of which package
      # happens to be behind this week.
      #
      # Runs on both arches on purpose: the `type=gha` cache is scoped
      # per platform, so an amd64-only check would miss an arm64
      # cache hit.
      - name: Verify no pending Debian security updates
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          # `Error-Mode=any` + `set -e` inside the container matter:
          # plain `apt-get update` exits 0 when it cannot reach a
          # mirror (fetch failures are warnings), so an unreachable
          # archive would produce empty output and read as "nothing
          # pending" — a silent pass on the very check that exists to
          # catch silent passes.
          pending=$(docker run --rm --user root --entrypoint sh "$image" -c \
            'set -e; apt-get update -qq -o APT::Update::Error-Mode=any >/dev/null; apt-get -s -y upgrade 2>/dev/null | grep "^Inst " || true')
          if [ -n "$pending" ]; then
            echo "::error::Published image still has upgradable Debian packages - the apt layer came from cache (issue #239)" >&2
            echo "$pending" >&2
            exit 1
          fi
          echo "No pending Debian upgrades in $image"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve image name
        run: |
          owner="${{ github.repository_owner }}"
          echo "IMAGE_NAME=ghcr.io/${owner,,}/atrium" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # ``type=semver`` defaults to extracting from ``github.ref``,
          # which is correct for the ``on: push: tags`` path
          # (``refs/tags/v1.2.3``) but wrong for ``workflow_dispatch``
          # and ``schedule`` — both run against the workflow file's
          # branch (``refs/heads/master``). Without an explicit
          # ``value=`` override, a re-publish drops every semver tag
          # and only ``type=raw,value=latest`` lands, which is what
          # bit the v0.11.2 re-dispatch. The ``resolve`` job above
          # normalises all three triggers to one string.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.ref }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.ref }}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        # `imagetools create` accepts repeated -t flags for tags and
        # one or more @sha256:... source refs; jq pulls the tag list
        # straight out of metadata-action's JSON output. Word
        # splitting on the two $(...) substitutions is intentional —
        # each tag and each digest must arrive as its own argv slot.
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
