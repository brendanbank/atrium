name: Security

# Four supply-chain scans on a single workflow:
#   - Trivy fs + image scan of the runtime image (SARIF -> Security tab)
#   - Trivy image scan of the *published* release tag (weekly)
#   - pip-audit of the backend deps (advisory on PRs, gating weekly)
#   - pnpm audit of the SPA deps (informational)
#
# The first scans the recipe; the second scans the artifact. They are
# not the same thing: a tag published two weeks ago accumulates Debian
# CVEs that an image built this minute never shows, and until issue
# #239 only downstream consumers ever saw the difference.
#
# Triggered on PRs and pushes to master, plus a weekly cron so a fresh
# CVE on an unchanged repo still surfaces within seven days.
#
# `actions: read` is non-obvious but required: codeql-action/upload-sarif
# reads workflow-run metadata to attach SARIF to the right run, and
# without it the upload fails silently with
# "Resource not accessible by integration - workflow-runs".

on:
  push:
    branches: [master]
  pull_request:
    # Doc-only PRs skip the supply-chain scans — no lockfiles, no
    # Dockerfile, no source touched. The master push + weekly cron
    # still keep coverage end-to-end on whatever lands.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENCE.md"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy (runtime image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # The `atrium` package is public, so this is not strictly
      # required for pulls -- it is kept for the authenticated rate
      # limit and so the step keeps working if the package is ever
      # flipped back to private.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without this the `type=gha` cache below would restore the
      # runtime `apt-get upgrade` layer from whenever it was last
      # built, so the scan would report the package set of a
      # week-old build rather than of today's Debian archive
      # (issue #239). Daily granularity: the first run of the day
      # pays for the upgrade, the rest still hit cache.
      - name: Stamp apt cache-buster
        run: echo "APT_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          pull: true
          tags: atrium:scan
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_DEFAULT_LANGUAGE=en
            APT_REFRESH=${{ env.APT_REFRESH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Filesystem scan catches dep CVEs (uv.lock, pnpm-lock.yaml),
      # Dockerfile / IaC misconfig, and committed secrets. Skipping
      # node_modules and the python venv keeps the scan focused on
      # the lockfiles + sources rather than the materialised deps.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-dirs: frontend/node_modules,backend/.venv

      - name: Upload Trivy fs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # OS-package CVEs in the python:3.13-slim base + the Vite-built
      # SPA's bundled deps. api + worker share this image, so one
      # scan covers both runtime roles.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: atrium:scan
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # Scans the artifact consumers actually pull, not the recipe. The
  # weekly cron is set an hour after `publish-images.yml` refreshes the
  # current release tag, so in the normal case this also catches a
  # rebuild that was a silent cache no-op.
  #
  # It is a scheduling convention, not a guarantee: GitHub runs cron
  # workflows on a best-effort basis and delays them under load, so a
  # rebuild that slips past 06:00 leaves this scanning last week's
  # image. The failure direction is benign -- stale CVEs reported for
  # an image that has since been refreshed, which clears itself on the
  # next run -- so it is noise, never a false all-clear. Chain the two
  # with `workflow_run` if that noise ever becomes annoying.
  #
  # Not run on PRs or master pushes - the published tag doesn't change
  # on either, so it would be the same scan over and over.
  trivy-published:
    name: Trivy (published release tag)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # upload-sarif resolves the analysis against the checked-out
      # commit, so the checkout is required even though nothing in
      # the scan reads the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published image ref
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          # `releases/latest` skips drafts and pre-releases. The git
          # tag is `vX.Y.Z`; metadata-action publishes the registry
          # tag without the `v`, hence the ${tag#v} strip.
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name)
          echo "ref=ghcr.io/${owner,,}/atrium:${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-published.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy published SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: trivy-published.sarif
          category: trivy-published

  pip-audit:
    name: pip-audit (backend deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Sync deps
        run: uv sync

      # Advisory on PRs and master pushes, GATING on the weekly cron.
      #
      # pip-audit is not just a Dependabot backstop for Python: it
      # reads the PyPA/OSV database, which carries PYSEC advisories
      # that never become GitHub advisories at all, so Dependabot
      # structurally cannot raise them. CVE-2026-7246 in `click` was
      # one of those -- no GHSA, no Dependabot alert -- and because
      # this step could not fail it sat unnoticed in the job log
      # until someone happened to read it.
      #
      # Failing on PRs instead would hold every unrelated PR hostage
      # to an advisory with no released fix upstream (pip-audit has
      # no --ignore-unfixed). Failing on the cron puts the signal on
      # the one run nobody is watching, without blocking anyone: a
      # red weekly Security run IS the notification.
      #
      # Uploading to the Security tab is the obvious alternative but
      # pip-audit emits only columns/json/cyclonedx/markdown -- no
      # SARIF -- so it would need a bespoke converter to maintain.
      - name: Run pip-audit
        id: pip_audit
        continue-on-error: true
        run: uv run --with pip-audit pip-audit --strict --progress-spinner off

      - name: Gate the weekly scan on pip-audit findings
        if: github.event_name == 'schedule' && steps.pip_audit.outcome == 'failure'
        run: |
          echo "::error::pip-audit reported vulnerabilities on the weekly scan - see the 'Run pip-audit' step above"
          exit 1

  pnpm-audit:
    name: pnpm audit (SPA deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          version: 10.33.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Non-blocking on every trigger, deliberately unlike pip-audit
      # above. npm's advisory source of truth IS the GitHub advisory
      # database, so anything pnpm audit finds here Dependabot has
      # already alerted on and opened a PR for. Kept as a cheap
      # second opinion, not as a gate.
      - name: Run pnpm audit
        run: pnpm audit --audit-level high || true
